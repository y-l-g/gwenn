# Builds the static site and publishes it to GitHub Pages (preview at jojojardin.y-l.fr).
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [site-vitrine]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://jojojardin.y-l.fr
          # Preview: keep it out of search engines.
          NEXT_PUBLIC_NOINDEX: "1"
      # Custom domain, and stop Pages from running Jekyll (which drops the _next folder).
      - run: echo "jojojardin.y-l.fr" > out/CNAME && touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
